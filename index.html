<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>One Piece Pocket</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="logo"><span class="logo-main">One Piece</span><span class="logo-sub">Pocket</span></h1>
      <div class="topbar-actions">
        <button id="sound-button" class="icon-button" type="button" aria-label="Réglages du son"></button>
        <span class="topbar-pill" title="Cartes obtenues">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>
          <span id="topbar-count">0/0</span>
        </span>
      </div>
    </header>
    <main id="view" class="view-root"></main>
    <nav class="tabbar" aria-label="Menu principal">
      <button class="tab" type="button" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l2 1.5L10 3l2 1.5L14 3l2 1.5L18 3v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"/><path d="M9 9h6M9 13h6"/></svg>
        <span>Boosters</span>
      </button>
      <button class="tab" type="button" data-tab="collection">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>
        <span>Collection</span>
      </button>
      <button class="tab" type="button" data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span>Profil</span>
      </button>
    </nav>
  </div>
  <script src="src/data/cards-op01.js"></script>
  <script src="src/data/labels.js"></script>
  <script src="src/data/boosters.js"></script>
  <script src="src/data/audio.js"></script>
  <script src="src/booster.js"></script>
  <script src="src/cards.js"></script>
  <script src="src/collection.js"></script>
  <script src="src/ui/dom.js"></script>
  <script src="src/ui/sound.js"></script>
  <script src="src/ui/card-view.js"></script>
  <script src="src/ui/modal.js"></script>
  <script src="src/ui/opening.js"></script>
  <script src="src/ui/sound-panel.js"></script>
  <script src="src/ui/home-view.js"></script>
  <script src="src/ui/collection-view.js"></script>
  <script src="src/ui/profile-view.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
