<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>One Piece Pocket</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">
        <img class="brand-mark" src="assets/icon.svg" alt="" width="30" height="30">
        <span><strong>One Piece</strong> Pocket</span>
      </h1>
      <div class="topbar-actions">
        <button id="sound-button" class="icon-button" type="button" aria-label="Réglages du son"></button>
        <button id="account-button" class="icon-button account-button" type="button" aria-label="Se connecter"></button>
      </div>
    </header>
    <main id="view" class="view-root"></main>
    <nav class="tabbar" aria-label="Menu principal">
      <button class="tab" type="button" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Accueil</span>
      </button>
      <button class="tab" type="button" data-tab="collection">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>
        <span>Collection</span>
      </button>
      <button class="tab" type="button" data-tab="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span>Profil</span>
      </button>
    </nav>
  </div>
  <script src="src/data/cards.js"></script>
  <script src="src/data/labels.js"></script>
  <script src="src/data/boosters.js"></script>
  <script src="src/data/audio.js"></script>
  <script src="src/data/cloud-config.js"></script>
  <script src="src/booster.js"></script>
  <script src="src/cards.js"></script>
  <script src="src/collection.js"></script>
  <script src="src/timer.js"></script>
  <script src="src/progress.js"></script>
  <script src="src/cloud.js"></script>
  <script src="src/ui/dom.js"></script>
  <script src="src/ui/sound.js"></script>
  <script src="src/ui/card-view.js"></script>
  <script src="src/ui/modal.js"></script>
  <script src="src/ui/opening.js"></script>
  <script src="src/ui/sound-panel.js"></script>
  <script src="src/ui/account-panel.js"></script>
  <script src="src/ui/home-view.js"></script>
  <script src="src/ui/collection-view.js"></script>
  <script src="src/ui/profile-view.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
